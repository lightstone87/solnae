<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>솔내고 통합 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F6F4;
  --surface: #FFFFFF;
  --surface-2: #F8FAF8;
  --hover: #F1F5F2;
  --ink: #1C2521;
  --ink-2: #4E5B55;
  --ink-3: #7A8680;
  --line: #DCE2DE;
  --line-2: #EBEFEC;
  --pine: #1F5C45;
  --pine-ink: #164433;
  --pine-tint: #E4EFE9;
  --red: #C0392B;
  --red-tint: #FBEAE7;
  --blue: #2C5AA0;
  --ochre: #8A5F0F;
  --ochre-tint: #F6EDDA;
  --slate: #3C5878;
  --slate-tint: #E5EBF2;
  --mark: #FFE38A;
  --focus: #2C5AA0;
  --serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Noto Sans CJK KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111614; --surface: #192019; --surface-2: #1E2622; --hover: #222B27;
    --ink: #E6ECE8; --ink-2: #B4BFB9; --ink-3: #85918B; --line: #2E3833; --line-2: #252E2A;
    --pine: #3B8A69; --pine-ink: #9FD4BC; --pine-tint: #1D3229;
    --red: #F07A6C; --red-tint: #3A2321; --blue: #82A9EA;
    --ochre: #DDB062; --ochre-tint: #362C1C; --slate: #8FAAD0; --slate-tint: #222C38;
    --mark: #6B5A16; --focus: #82A9EA;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* ---------- 머리 ---------- */
.top { max-width: 1360px; margin: 0 auto; padding: 22px 32px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.brand .school { display: block; font-size: 13px; color: var(--ink-3); }
.brand h1 { margin: 2px 0 0; font: 700 26px/1.2 var(--serif); color: var(--pine-ink); }
.status { display: flex; align-items: center; gap: 10px; }
.updated { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.tabs { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.tabs-inner { max-width: 1360px; margin: 0 auto; padding: 0 32px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-inner::-webkit-scrollbar { display: none; }
.tabs button { appearance: none; border: 0; background: none; padding: 12px 16px 10px; font-size: 15.5px; font-weight: 500; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--pine-ink); border-bottom-color: var(--pine); font-weight: 600; }

main { max-width: 1360px; margin: 0 auto; padding: 24px 32px 72px; }

.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 14px; line-height: 1.35; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--pine); border-color: var(--pine); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }

.notice { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 4px 8px 8px 4px; padding: 14px 18px; margin: 0 0 16px; }
.notice b { display: block; margin-bottom: 2px; }
.notice small { color: var(--ink-3); }
.muted { color: var(--ink-3); }

.loading { padding: 18vh 0; text-align: center; color: var(--ink-2); }
.loading .bar { width: 180px; height: 3px; margin: 16px auto 0; background: var(--line); border-radius: 3px; overflow: hidden; position: relative; }
.loading .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--pine); border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 999px; line-height: 1.7; white-space: nowrap; }
.tag-w { background: var(--ochre-tint); color: var(--ochre); }
.tag-m { background: var(--pine-tint); color: var(--pine-ink); }
.who { color: var(--ink-3); font-size: 13px; margin-left: 6px; }
.chip { display: inline-block; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-left: 6px; line-height: 1.6; white-space: nowrap; vertical-align: 1px; }

/* ---------- 한눈에 보기 ---------- */
.ov { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: start; }
.rail { display: flex; flex-direction: column; gap: 30px; }
.h2 { font: 600 15px/1.4 var(--sans); margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
.h2 .sub { font-weight: 400; font-size: 13px; color: var(--ink-3); }

.ilryeok { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; position: relative; margin-bottom: 8px;
  box-shadow: 0 3px 0 -1px var(--surface), 0 4px 0 -1px var(--line), 0 7px 0 -3px var(--surface), 0 8px 0 -3px var(--line); }
.ilryeok-top { background: var(--pine); color: #fff; border-radius: 5px 5px 0 0; text-align: center; padding: 8px 12px; font-size: 14px; position: relative; font-variant-numeric: tabular-nums; }
.ring { position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
.ring.l { left: 22px; } .ring.r { right: 22px; }
.ilryeok-face { display: block; width: 100%; background: none; border: 0; cursor: pointer; padding: 14px 0 0; }
.ilryeok-day { display: block; font: 700 92px/1 var(--serif); text-align: center; font-variant-numeric: tabular-nums; }
.ilryeok-dow { display: block; text-align: center; font: 400 18px/1.6 var(--serif); color: var(--ink-2); }
.ilryeok.is-red .ilryeok-day, .ilryeok.is-red .ilryeok-dow { color: var(--red); }
.ilryeok.is-blue .ilryeok-day, .ilryeok.is-blue .ilryeok-dow { color: var(--blue); }
.ilryeok-list { border-top: 1px dashed var(--line); margin-top: 14px; padding: 12px 18px 16px; }
.ilryeok-list ul { list-style: none; margin: 0; padding: 0; }
.ilryeok-list li { padding: 3px 0; font-size: 14px; white-space: pre-line; }
.ilryeok-list .tag { margin-right: 6px; vertical-align: 1px; }

.mcard { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--kc); border-radius: 4px 8px 8px 4px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
.mcard:hover { background: var(--hover); }
.k-bujang { --kc: var(--pine); --kt: var(--pine-tint); }
.k-gyomu { --kc: var(--slate); --kt: var(--slate-tint); }
.k-weekly { --kc: var(--ochre); }
.mcard-kind { font-weight: 600; }
.mcard-dday { justify-self: end; font-weight: 600; color: var(--kc); font-variant-numeric: tabular-nums; }
.mcard-date { grid-column: 1 / -1; font: 700 21px/1.3 var(--serif); font-variant-numeric: tabular-nums; }
.mcard-fill { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.fillbar { flex: 0 0 80px; height: 5px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.fillbar i { display: block; height: 100%; background: var(--kc); }
.mcard-prev { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); }

.uplist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.uplist > li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.uplist ul { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.uplist ul li + li { margin-top: 2px; }
.datebtn { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; align-self: start; }
.datebtn small { font-weight: 400; color: var(--ink-3); margin-left: 3px; }
.is-red-t { color: var(--red); }
.is-blue-t { color: var(--blue); }
.ev-hol { color: var(--red); }
.note { font-size: 13px; color: var(--ink-3); margin: 10px 0 0; }

.sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 12px; }
.h1 { font: 700 23px/1.3 var(--serif); margin: 0; }
.range { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.legend { margin-left: auto; display: flex; gap: 6px; }

table.wk { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; table-layout: fixed; }
.wk thead th { font-size: 13px; font-weight: 600; color: var(--ink-2); text-align: left; padding: 9px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.wk thead th.c-wk { box-shadow: inset 0 3px 0 var(--ochre); }
.wk thead th.c-mo { box-shadow: inset 0 3px 0 var(--pine); }
.wk td, .wk tbody th { vertical-align: top; padding: 12px 16px; border-bottom: 1px solid var(--line-2); text-align: left; font-weight: 400; }
.wk tbody tr:last-child > * { border-bottom: 0; }
.wk .c-date { width: 96px; }
.wk tr.is-today > * { background: var(--pine-tint); }
.daybtn { display: flex; flex-direction: column; align-items: flex-start; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.daybtn .d { font: 700 21px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.daybtn .w { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
.daybtn .w b { color: var(--pine-ink); font-weight: 600; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { position: relative; padding: 2px 0 2px 13px; white-space: pre-line; }
.items li + li { margin-top: 4px; }
.items li::before { content: ""; position: absolute; left: 0; top: .78em; width: 5px; height: 5px; border-radius: 50%; background: var(--dot, var(--ink-3)); }
.c-wk .items { --dot: var(--ochre); }
.c-mo .items { --dot: var(--pine); }
.empty-cell { color: var(--ink-3); font-size: 13px; }

/* ---------- 회의 ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 16px; max-width: 1080px; }
.pager { display: flex; align-items: center; gap: 6px; }
.sheet-select { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); min-width: 200px; max-width: 260px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); cursor: pointer; user-select: none; }
.search { display: flex; gap: 6px; margin-left: auto; }
.search input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; width: 230px; background: var(--surface); }

.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 26px 32px 22px; max-width: 1080px; }
.doc-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--kc); }
.doc-title { font: 700 27px/1.25 var(--serif); margin: 0; letter-spacing: .32em; }
.doc-date { margin: 6px 0 0; font-size: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dday { display: inline-block; margin-left: 8px; font-size: 13px; font-weight: 600; color: var(--kc); }
.doc-meta { margin: 0; font-size: 13px; color: var(--ink-3); text-align: right; }
table.minutes { width: 100%; border-collapse: collapse; }
.minutes thead th { font-size: 13px; color: var(--ink-3); font-weight: 500; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.minutes td, .minutes tbody th { vertical-align: top; text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--line-2); }
.minutes tbody tr:last-child > * { border-bottom: 0; }
.minutes .m-dept { width: 150px; font-weight: 600; }
.minutes .m-text { white-space: pre-wrap; line-height: 1.75; overflow-wrap: anywhere; }
.minutes tr.is-empty .m-dept { color: var(--ink-3); font-weight: 500; }
.doc-foot { margin: 14px 0 0; font-size: 13px; color: var(--ink-3); }
.empty { padding: 44px 16px 36px; text-align: center; }
.empty p { margin: 0 0 6px; }
.empty .sub { color: var(--ink-3); font-size: 14px; margin-bottom: 18px; }
.doc-loading { padding: 60px 0; text-align: center; color: var(--ink-3); }

.results { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; max-width: 1080px; }
.results-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line-2); font-size: 14px; }
.results-head .btn { margin-left: auto; }
.results-list { list-style: none; margin: 0; padding: 4px 0; max-height: 300px; overflow: auto; }
.results-list button { display: grid; grid-template-columns: 120px 130px minmax(0, 1fr); gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 18px; cursor: pointer; font-size: 14px; }
.results-list button:hover { background: var(--hover); }
.results-list .r-date { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.results-list .r-dept { font-weight: 600; }
.results-list .r-snip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .pad { padding: 16px 18px; color: var(--ink-3); font-size: 14px; }

/* ---------- 주간업무 ---------- */
table.weekly { width: 100%; border-collapse: collapse; }
.weekly thead th { font-size: 13px; color: var(--ink-3); font-weight: 500; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.weekly td, .weekly tbody th { vertical-align: top; text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line-2); font-weight: 400; }
.weekly tbody th { width: 110px; border-right: 1px solid var(--line-2); }
.weekly tbody tr.day-start > * { border-top: 1px solid var(--line); }
.weekly .w-text { white-space: pre-line; }
.weekly .w-dept { width: 160px; white-space: pre-line; color: var(--ink-2); font-size: 14px; }
.weekly .w-note { width: 120px; color: var(--ink-2); font-size: 14px; white-space: pre-line; }
.weekly tr.is-today > * { background: var(--pine-tint); }
.notices { margin-top: 22px; }
.notices h3 { font-size: 15px; margin: 0 0 8px; }
.notices dl { margin: 0; display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; }
.notices dt { font-weight: 600; }
.notices dd { margin: 0; white-space: pre-line; }

/* ---------- 월간계획 ---------- */
.mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
.mnav { display: flex; align-items: center; gap: 6px; }
.mtitle { font: 700 24px/1.2 var(--serif); margin: 0 6px; min-width: 156px; text-align: center; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 14px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--pine); color: #fff; }
.mbar .search { margin-left: auto; }
.mnote { font-size: 14px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 14px; margin: 0 0 14px; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal .wd { background: var(--surface-2); padding: 7px 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.cal .wd.sun { color: var(--red); } .cal .wd.sat { color: var(--blue); }
.cell { background: var(--surface); min-height: 122px; padding: 7px 7px 9px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.cell:hover { background: var(--hover); }
.cell.blank { background: var(--surface-2); cursor: default; }
.cell .num { font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; padding: 0 4px; align-self: flex-start; line-height: 1.6; }
.cell.red .num { color: var(--red); }
.cell.blue .num { color: var(--blue); }
.cell.today .num { background: var(--pine); color: #fff; border-radius: 999px; padding: 0 8px; }
.cell .ev { display: block; font-size: 12.5px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid var(--pine); padding-left: 6px; }
.cell .ev.hol { border-left-color: var(--red); color: var(--red); }
.cell .more { font-size: 12px; color: var(--ink-3); padding-left: 8px; }

.mlist { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.mlist .row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line-2); }
.mlist .row:last-child { border-bottom: 0; }
.mlist .row.today { background: var(--pine-tint); }
.mlist .datebtn { font-size: 15px; }
.mlist .items { --dot: var(--pine); }
.mlist .row-head { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-size: 14px; }
.mlist .row-head .btn { margin-left: auto; }

/* ---------- 날짜 상세 ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(15, 25, 20, .3); z-index: 20; }
.daypanel { position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100%); background: var(--surface); z-index: 21; overflow: auto; padding: 22px 24px 32px; box-shadow: -10px 0 30px rgba(0,0,0,.14); animation: inR .18s ease-out; }
@keyframes inR { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.dp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.dp-head h2 { font: 700 23px/1.3 var(--serif); margin: 0; flex: 1; font-variant-numeric: tabular-nums; }
.dp-sec { margin-bottom: 22px; }
.dp-sec .tag { margin-bottom: 8px; }
.dp-sec .items li { padding-top: 4px; padding-bottom: 4px; }
.dp-owner { display: block; color: var(--ink-3); font-size: 13px; }
.dp-nav { display: flex; justify-content: space-between; border-top: 1px solid var(--line-2); padding-top: 14px; }

@media (prefers-reduced-motion: reduce) {
  .daypanel { animation: none; }
  .loading .bar::after { animation: none; width: 100%; }
}

/* ---------- 좁은 화면 ---------- */
@media (max-width: 1080px) {
  .ov { grid-template-columns: 264px minmax(0, 1fr); gap: 24px; }
}
@media (max-width: 760px) {
  .top { padding: 16px 16px 8px; }
  .brand h1 { font-size: 22px; }
  .tabs-inner { padding: 0 8px; }
  .tabs button { padding: 11px 12px 9px; font-size: 15px; }
  main { padding: 16px 16px 64px; }
  .ov { grid-template-columns: 1fr; }
  .rail { gap: 24px; }
  .legend { margin-left: 0; }
  table.wk, .wk tbody, .wk tr, .wk td, .wk tbody th { display: block; width: auto; }
  .wk thead { display: none; }
  .wk tbody tr { border-bottom: 1px solid var(--line); }
  .wk tbody tr:last-child { border-bottom: 0; }
  .wk td, .wk tbody th { border: 0; padding: 8px 14px; }
  .wk tbody th { padding-top: 12px; }
  .daybtn { flex-direction: row; align-items: baseline; gap: 8px; }
  .wk td::before { content: attr(data-label); display: block; font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .wk td.c-wk::before { color: var(--ochre); }
  .wk td.c-mo::before { color: var(--pine-ink); }
  .toolbar { gap: 10px; }
  .pager { width: 100%; }
  .sheet-select { flex: 1; min-width: 0; max-width: none; }
  .search { margin-left: 0; width: 100%; }
  .search input { flex: 1; width: auto; min-width: 0; }
  .doc { padding: 18px 16px; }
  .doc-title { font-size: 23px; }
  .doc-meta { text-align: left; }
  table.minutes, .minutes tbody, .minutes tr, .minutes td, .minutes tbody th { display: block; width: auto; }
  .minutes thead { display: none; }
  .minutes tbody th { padding: 12px 0 2px; border: 0; }
  .minutes td { padding: 0 0 12px; }
  .minutes .m-dept { width: auto; }
  .results-list button { grid-template-columns: 1fr; gap: 0; }
  table.weekly, .weekly tbody, .weekly tr, .weekly td, .weekly tbody th { display: block; width: auto; border-right: 0; }
  .weekly thead { display: none; }
  .weekly td { border: 0; padding: 2px 0 8px; }
  .weekly tbody th { padding: 12px 0 4px; border-bottom: 0; }
  .weekly .w-dept, .weekly .w-note { width: auto; padding-top: 0; }
  .notices dl { grid-template-columns: 1fr; gap: 2px; }
  .notices dd { margin-bottom: 8px; }
  .mbar .search { margin-left: 0; }
  .mtitle { font-size: 21px; min-width: 130px; }
  .cal .wd { padding: 6px 4px; text-align: center; }
  .cell { min-height: 64px; padding: 4px 2px; align-items: center; }
  .cell .ev, .cell .more { display: none; }
  .cell.has-ev::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--pine); }
  .cell.has-ev.red::after { background: var(--red); }
  .mlist .row { grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 12px 14px; }
  .daypanel { top: auto; left: 0; width: 100%; max-height: 84vh; border-radius: 16px 16px 0 0; padding: 18px 18px 28px; animation-name: inU; }
  @keyframes inU { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>
</head>

<script>
(function () {
  'use strict';

  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var KIND = { bujang: '부장회의', gyomu: '교무회의' };
  var narrow = window.matchMedia('(max-width: 760px)');

  var S = {
    data: null,
    view: 'overview',
    fresh: false,
    meet: { bujang: newMeet(), gyomu: newMeet() },
    month: { key: null, mode: narrow.matches ? 'list' : 'grid', query: '' },
    dayIndex: {},
    monthKeys: {},
    openDay: null,
    lastFocus: null
  };
  function newMeet() { return { idx: 0, cache: {}, hideEmpty: true, query: '', search: null, searching: false, loading: false, error: '' }; }

  // ---------- 도우미 ----------
  function $(sel, el) { return (el || document).querySelector(sel); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hl(text, q) {
    var t = esc(text);
    if (!q) return t;
    var qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return t.replace(new RegExp(qe, 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
  }
  var HOL_RE = /^(신정|설날|설\s*연휴|삼일절|3\.?1절|어린이날|부처님\s*오신\s*날|석가탄신일|현충일|제헌절|광복절|추석|추석\s*연휴|개천절|한글날|성탄절|기독탄신일|대체\s*휴일|대체\s*공휴일|임시\s*공휴일|개교기념일|재량\s*휴업일?|.*선거일|.*연휴)$/;
  function isHol(ev) { return HOL_RE.test(String(ev.text || '').trim()); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function D(iso) { var a = iso.split('-'); return new Date(Date.UTC(+a[0], +a[1] - 1, +a[2])); }
  function I(dt) { return dt.getUTCFullYear() + '-' + p2(dt.getUTCMonth() + 1) + '-' + p2(dt.getUTCDate()); }
  function add(iso, n) { var d = D(iso); d.setUTCDate(d.getUTCDate() + n); return I(d); }
  function dow(iso) { return D(iso).getUTCDay(); }
  function md(iso) { var d = D(iso); return (d.getUTCMonth() + 1) + '.' + d.getUTCDate(); }
  function mdw(iso) { return md(iso) + '(' + DOW[dow(iso)] + ')'; }
  function diff(a, b) { return Math.round((D(b) - D(a)) / 86400000); }
  function dday(iso) {
    var n = diff(S.data.today, iso);
    if (n === 0) return '오늘';
    return n > 0 ? 'D-' + n : (-n) + '일 지남';
  }
  function dayTone(iso) {
    var day = S.dayIndex[iso], w = dow(iso);
    if (w === 0 || (day && day.holiday)) return 'red';
    if (w === 6) return 'blue';
    return '';
  }
  function errorBox(title, detail) {
    return '<div class="notice"><b>' + esc(title) + '</b>' + (detail ? '<small>' + esc(detail) + '</small>' : '') + '</div>';
  }
  // ---------- 데이터 불러오기 ----------
  // 1) 앱스 스크립트 웹앱 안에서 열면: google.script.run 사용
  // 2) 다른 곳(GitHub Pages 등)에 올려 열면: 웹앱의 데이터 주소(?api=)를 로그인 정보 없이 호출
  //    → 구글 계정이 여러 개 로그인된 브라우저에서도 열립니다.
  //    데이터 주소는 링크 끝의 #웹앱배포ID 로 받습니다(한 번 열면 이 브라우저가 기억합니다).
  //    링크에 붙이지 않으려면 아래 API_URL에 웹앱 주소를 직접 적어도 됩니다.
  var API_URL = '';
  var API_STORE = 'solnae-schedule.api';

  function toApiUrl(s) {
    try { s = decodeURIComponent(String(s || '')).trim(); } catch (e) { s = String(s || '').trim(); }
    s = s.replace(/^api=/, '').replace(/\/macros\/u\/\d+\//, '/macros/');
    if (/^AKfy[\w-]+$/.test(s)) return 'https://script.google.com/macros/s/' + s + '/exec';
    if (/^https:\/\/script\.google\.com\/(?:a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/exec$/.test(s)) return s;
    return '';
  }
  function apiBase() {
    var fromHash = toApiUrl((location.hash || '').replace(/^#/, ''));
    if (fromHash) { try { localStorage.setItem(API_STORE, fromHash); } catch (e) {} return fromHash; }
    var fixed = toApiUrl(API_URL);
    if (fixed) return fixed;
    try { return toApiUrl(localStorage.getItem(API_STORE)); } catch (e) { return ''; }
  }
  function inAppsScript() { return !!(window.google && google.script && google.script.run); }

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (inAppsScript()) {
      return new Promise(function (resolve, reject) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        r[fn].apply(r, args);
      });
    }
    var base = apiBase();
    if (!base) return Promise.reject(new Error('데이터 주소가 없는 링크입니다. 받은 링크를 # 뒤까지 모두 복사해 열어 주세요.'));
    var q = {};
    if (fn === 'getDashboard') { q.api = 'dashboard'; if (args[0]) q.force = '1'; }
    else if (fn === 'getMeeting') { q.api = 'meeting'; q.kind = args[0]; q.sheet = args[1]; if (args[2]) q.force = '1'; }
    else if (fn === 'searchMeetings') { q.api = 'search'; q.kind = args[0]; q.q = args[1]; }
    var qs = Object.keys(q).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(q[k]); }).join('&');
    return fetch(base + '?' + qs, { method: 'GET', credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('데이터 주소가 응답하지 않습니다 (HTTP ' + res.status + ').');
        return res.json().catch(function () {
          throw new Error('데이터 주소의 응답을 읽지 못했습니다. 웹앱을 새 버전으로 다시 배포했는지, 액세스가 ‘모든 사용자’인지 확인하세요.');
        });
      })
      .then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || '데이터를 불러오지 못했습니다.');
        return j.data;
      }, function (e) {
        if (e instanceof TypeError) throw new Error('데이터 주소에 연결하지 못했습니다. 인터넷 연결과 웹앱 배포 설정(액세스: 모든 사용자)을 확인하세요.');
        throw e;
      });
  }
  function msg(e) { return (e && e.message) ? e.message : String(e); }

  function monthsArr() {
    var m = S.data && S.data.monthly;
    return (m && !m.error && m.months) ? m.months : [];
  }
  function weeklyMap() {
    var w = S.data && S.data.weekly, map = {};
    if (w && !w.error) w.days.forEach(function (d) { map[d.date] = d; });
    return map;
  }
  function buildIndex() {
    S.dayIndex = {}; S.monthKeys = {};
    monthsArr().forEach(function (m) {
      S.monthKeys[m.year + '-' + p2(m.month)] = true;
      Object.keys(m.days).forEach(function (k) { S.dayIndex[k] = m.days[k]; });
    });
  }

  // ---------- 불러오기 ----------
  function load(force) {
    var btn = $('#refreshBtn');
    btn.disabled = true;
    if (force) btn.textContent = '읽는 중…';
    return call('getDashboard', !!force).then(function (d) {
      S.data = d;
      if (force) {
        S.fresh = true;
        ['bujang', 'gyomu'].forEach(function (k) { S.meet[k].cache = {}; });
      }
      ['bujang', 'gyomu'].forEach(function (k) {
        var s = d[k], st = S.meet[k];
        if (!s || s.error) return;
        if (s.current) st.cache[s.current.sheet] = s.current;
        if (s.previous) st.cache[s.previous.sheet] = s.previous;
        if (st.idx >= s.sheets.length) st.idx = 0;
      });
      buildIndex();
      var keys = monthsArr().map(function (m) { return m.year + '-' + p2(m.month); });
      if (!S.month.key || keys.indexOf(S.month.key) < 0) S.month.key = defaultMonthKey(keys);
      $('#updated').textContent = d.generatedAt + ' 기준';
      $('#fatal').hidden = true;
      $('#loading').hidden = true;
      renderAll();
      showView(S.view, false);
    }).catch(function (e) {
      $('#loading').hidden = true;
      if (!S.data) {
        var f = $('#fatal');
        f.innerHTML = errorBox('일정을 불러오지 못했습니다.', msg(e)) + '<button class="btn primary" type="button" data-act="retry">다시 불러오기</button>';
        f.hidden = false;
      } else {
        alert('새로 읽지 못했습니다: ' + msg(e));
      }
    }).then(function () {
      btn.disabled = false;
      btn.textContent = '새로고침';
    });
  }

  function defaultMonthKey(keys) {
    if (!keys.length) return null;
    var tk = S.data.today.slice(0, 7);
    if (keys.indexOf(tk) >= 0) return tk;
    var past = keys.filter(function (k) { return k <= tk; });
    return past.length ? past[past.length - 1] : keys[0];
  }

  function renderAll() {
    renderOverview();
    renderMeetingView('bujang');
    renderMeetingView('gyomu');
    renderWeekly();
    renderMonthly();
  }

  // ---------- 메뉴 전환 ----------
  function showView(v, focusTab) {
    S.view = v;
    document.querySelectorAll('[role=tab]').forEach(function (t) {
      var on = t.getAttribute('data-view') === v;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if (on && focusTab) t.focus();
    });
    if (!S.data) return;
    document.querySelectorAll('.view').forEach(function (s) { s.hidden = s.id !== 'view-' + v; });
    if (v === 'bujang' || v === 'gyomu') ensureMeeting(v);
  }

  // ---------- 한눈에 보기 ----------
  function renderOverview() {
    var d = S.data, t = d.today, el = $('#view-overview');
    var w = d.weekly;
    var wk = weeklyMap();
    var tone = dayTone(t);
    var dt = D(t);

    // 오늘 일정
    var todayItems = [];
    if (wk[t]) wk[t].items.forEach(function (it) {
      todayItems.push('<li><span class="tag tag-w">주간</span>' + esc(it.text) + (it.dept ? '<span class="who">' + esc(it.dept.replace(/\n/g, ', ')) + '</span>' : '') + '</li>');
    });
    var tday = S.dayIndex[t];
    if (tday) tday.events.forEach(function (ev) {
      todayItems.push('<li><span class="tag tag-m">월간</span>' + esc(ev.text) + (ev.owner ? '<span class="who">' + esc(ev.owner) + '</span>' : '') + '</li>');
    });
    var todayHtml = todayItems.length ? '<ul>' + todayItems.join('') + '</ul>' : '<span class="muted">오늘 등록된 일정이 없습니다.</span>';

    // 다음 2주 (주간업무 기간 다음 날부터)
    var wEnd = (w && !w.error && w.end) ? w.end : t;
    var base = wEnd > t ? wEnd : t;
    var start = add(base, 1), end = add(start, 13);
    var up = '', missing = [];
    for (var x = start; x <= end; x = add(x, 1)) {
      var mk = x.slice(0, 7);
      if (!S.monthKeys[mk]) { var mm = +x.slice(5, 7) + '월'; if (missing.indexOf(mm) < 0) missing.push(mm); continue; }
      var day = S.dayIndex[x];
      if (!day || !day.events.length) continue;
      var tn = dayTone(x);
      up += '<li><button type="button" class="datebtn ' + (tn ? 'is-' + tn + '-t' : '') + '" data-day="' + x + '">' + md(x) + '<small>' + DOW[dow(x)] + '</small></button><ul>' +
        day.events.map(function (ev) { return '<li' + (isHol(ev) ? ' class="ev-hol"' : '') + '>' + esc(ev.text) + '</li>'; }).join('') + '</ul></li>';
    }
    var upHtml = up ? '<ul class="uplist">' + up + '</ul>' : '<p class="muted" style="margin:0">이 기간에 등록된 일정이 없습니다.</p>';
    if (missing.length) upHtml += '<p class="note">' + missing.join(', ') + ' 월간계획 시트가 아직 없어 그 기간 일정은 빠져 있습니다.</p>';

    // 주간 일정 표
    var weekHtml;
    if (!w || w.error) {
      weekHtml = errorBox('주간업무를 읽지 못했습니다.', w && w.error);
    } else if (!w.days.length) {
      weekHtml = '<div class="notice"><b>주간업무 입력 시트가 비어 있습니다.</b></div>';
    } else {
      weekHtml = '<table class="wk"><thead><tr><th class="c-date">날짜</th><th class="c-wk">주간업무</th><th class="c-mo">월간계획</th></tr></thead><tbody>' +
        w.days.map(function (day) {
          var mday = S.dayIndex[day.date];
          var tn = dayTone(day.date);
          var wkItems = day.items.length ? '<ul class="items">' + day.items.map(function (it) {
            return '<li>' + esc(it.text) + (it.dept ? '<span class="chip">' + esc(it.dept.replace(/\n/g, ', ')) + '</span>' : '') + '</li>';
          }).join('') + '</ul>' : '<span class="empty-cell">없음</span>';
          var moItems = (mday && mday.events.length) ? '<ul class="items">' + mday.events.map(function (ev) {
            return '<li' + (isHol(ev) ? ' class="ev-hol"' : '') + '>' + esc(ev.text) + (ev.owner ? '<span class="who">' + esc(ev.owner) + '</span>' : '') + '</li>';
          }).join('') + '</ul>' + (mday.owners ? '<div class="who" style="margin:4px 0 0 13px">담당: ' + esc(mday.owners) + '</div>' : '')
            : '<span class="empty-cell">' + (S.monthKeys[day.date.slice(0, 7)] ? '없음' : '월간계획 시트 없음') + '</span>';
          var isToday = day.date === t;
          return '<tr class="' + (isToday ? 'is-today' : '') + '"><th scope="row" class="c-date"><button type="button" class="daybtn" data-day="' + day.date + '">' +
            '<span class="d ' + (tn ? 'is-' + tn + '-t' : '') + '">' + md(day.date) + '</span><span class="w">' + DOW[dow(day.date)] + '요일' + (isToday ? ' <b>오늘</b>' : '') + '</span></button></th>' +
            '<td class="c-wk" data-label="주간업무">' + wkItems + '</td><td class="c-mo" data-label="월간계획">' + moItems + '</td></tr>';
        }).join('') + '</tbody></table>';
    }

    var rangeText = (w && !w.error && w.start) ? mdw(w.start) + ' ~ ' + mdw(w.end) : '';

    el.innerHTML =
      '<div class="ov">' +
        '<div class="rail">' +
          '<article class="ilryeok ' + (tone ? 'is-' + tone : '') + '" aria-label="오늘 일정">' +
            '<div class="ilryeok-top"><span class="ring l"></span>' + dt.getUTCFullYear() + '년 ' + (dt.getUTCMonth() + 1) + '월<span class="ring r"></span></div>' +
            '<button type="button" class="ilryeok-face" data-day="' + t + '" aria-label="오늘 일정 자세히 보기">' +
              '<span class="ilryeok-day">' + dt.getUTCDate() + '</span><span class="ilryeok-dow">' + DOW[dow(t)] + '요일</span>' +
            '</button>' +
            '<div class="ilryeok-list">' + todayHtml + '</div>' +
          '</article>' +
          '<section><h2 class="h2">다가오는 회의</h2>' + meetCard('bujang') + meetCard('gyomu') + '</section>' +
          '<section><h2 class="h2">다음 2주<span class="sub">' + md(start) + ' ~ ' + md(end) + '</span></h2>' + upHtml + '</section>' +
        '</div>' +
        '<div class="ov-main">' +
          '<div class="sec-head"><h2 class="h1">주간 일정</h2><span class="range">' + rangeText + '</span>' +
            '<div class="legend"><span class="tag tag-w">주간업무</span><span class="tag tag-m">월간계획</span></div></div>' +
          weekHtml +
        '</div>' +
      '</div>';
  }

  function meetCard(kind) {
    var s = S.data[kind];
    if (!s || s.error) return errorBox(KIND[kind] + ' 파일을 읽지 못했습니다.', s && s.error);
    var c = s.current, p = s.previous;
    if (!c) return '<div class="notice"><b>' + KIND[kind] + ' 시트가 없습니다.</b></div>';
    var pct = c.total ? Math.round(c.filled / c.total * 100) : 0;
    return '<button type="button" class="mcard k-' + kind + '" data-goto="' + kind + '">' +
      '<span class="mcard-kind">' + KIND[kind] + '</span>' +
      '<span class="mcard-dday">' + (c.date ? dday(c.date) : '') + '</span>' +
      '<span class="mcard-date">' + (c.date ? mdw(c.date) : esc(c.sheet)) + '</span>' +
      '<span class="mcard-fill"><span class="fillbar"><i style="width:' + pct + '%"></i></span>부서 입력 ' + c.filled + '/' + c.total + '</span>' +
      (p ? '<span class="mcard-prev">직전 회의 ' + (p.date ? mdw(p.date) : esc(p.sheet)) + '</span>' : '') +
      '</button>';
  }

  // ---------- 부장회의 · 교무회의 ----------
  function renderMeetingView(kind) {
    var view = $('#view-' + kind), s = S.data[kind], st = S.meet[kind];
    var sel = $('.sheet-select', view);
    if (!s || s.error) {
      $('.toolbar', view).hidden = true;
      $('.meet-doc', view).innerHTML = errorBox(KIND[kind] + ' 파일을 읽지 못했습니다.', (s && s.error) + ' — 이 계정에 해당 스프레드시트를 볼 권한이 있는지 확인하세요.');
      return;
    }
    $('.toolbar', view).hidden = false;
    sel.innerHTML = s.sheets.map(function (n, i) {
      var label = n === '출력' ? '다음 회의 (출력 시트)' : n;
      var m = st.cache[n];
      if (m && m.isCurrent && m.date) label = '다음 회의 ' + mdw(m.date);
      return '<option value="' + i + '">' + esc(label) + '</option>';
    }).join('');
    $('.hide-empty', view).checked = st.hideEmpty;
    updatePager(kind);
    renderResults(kind);
    renderMeetingDoc(kind);
  }

  function updatePager(kind) {
    var view = $('#view-' + kind), s = S.data[kind], st = S.meet[kind];
    if (!s || s.error) return;
    $('.sheet-select', view).value = String(st.idx);
    $('[data-act=older]', view).disabled = st.idx >= s.sheets.length - 1;
    $('[data-act=newer]', view).disabled = st.idx <= 0;
  }

  function goMeeting(kind, idx) {
    var s = S.data[kind], st = S.meet[kind];
    if (!s || s.error) return;
    st.idx = Math.max(0, Math.min(s.sheets.length - 1, idx));
    st.error = '';
    updatePager(kind);
    ensureMeeting(kind);
  }

  function ensureMeeting(kind) {
    var s = S.data && S.data[kind], st = S.meet[kind];
    if (!s || s.error) return;
    var name = s.sheets[st.idx];
    if (st.cache[name]) { renderMeetingDoc(kind); return; }
    st.loading = true; st.error = '';
    renderMeetingDoc(kind);
    var want = st.idx;
    call('getMeeting', kind, name, S.fresh).then(function (m) {
      st.cache[name] = m;
    }).catch(function (e) {
      st.error = msg(e);
    }).then(function () {
      st.loading = false;
      if (st.idx === want) renderMeetingDoc(kind);
    });
  }

  function renderMeetingDoc(kind) {
    var view = $('#view-' + kind), s = S.data[kind], st = S.meet[kind];
    var box = $('.meet-doc', view);
    var name = s.sheets[st.idx], m = st.cache[name];
    if (!m) {
      box.innerHTML = st.error ? errorBox('회의록을 읽지 못했습니다.', st.error) : '<div class="doc"><div class="doc-loading">회의록을 읽는 중입니다…</div></div>';
      return;
    }
    var q = st.query;
    var rows = st.hideEmpty ? m.rows.filter(function (r) { return r.content && r.content.trim() !== '없음'; }) : m.rows;
    var hidden = m.rows.length - rows.length;
    var head =
      '<header class="doc-head"><div><h2 class="doc-title">' + esc(m.title || KIND[kind]) + '</h2>' +
      '<p class="doc-date">' + esc(m.dateText || m.sheet) + (m.date ? '<span class="dday">' + dday(m.date) + '</span>' : '') + '</p></div>' +
      '<p class="doc-meta">' + (m.isCurrent ? '다음 회의 자료(출력 시트)' : '시트 이름: ' + esc(m.sheet)) + '<br>부서 입력 ' + m.filled + '/' + m.total + '</p></header>';
    var body;
    if (m.isCurrent && m.filled === 0) {
      var prevName = s.sheets[st.idx + 1], prev = prevName ? st.cache[prevName] : null;
      body = '<div class="empty"><p>아직 내용을 입력한 부서가 없습니다.</p>' +
        '<p class="sub">각 부서가 ' + KIND[kind] + ' 파일의 입력 시트에 적으면 여기에 바로 나타납니다.</p>' +
        (prevName ? '<button class="btn primary" type="button" data-act="older">직전 회의' + (prev && prev.date ? '(' + mdw(prev.date) + ')' : '') + ' 보기</button>' : '') + '</div>';
    } else if (!rows.length) {
      body = '<div class="empty"><p>표시할 내용이 없습니다.</p><p class="sub">‘내용 없는 부서 숨기기’를 끄면 모든 부서를 볼 수 있습니다.</p></div>';
    } else {
      body = '<table class="minutes"><thead><tr><th scope="col">부서</th><th scope="col">업무 추진 내용</th></tr></thead><tbody>' +
        rows.map(function (r) {
          var empty = !r.content || r.content.trim() === '없음';
          return '<tr class="' + (empty ? 'is-empty' : '') + '"><th scope="row" class="m-dept">' + hl(r.dept, q) + '</th>' +
            '<td class="m-text">' + (r.content ? hl(r.content, q) : '<span class="muted">내용 없음</span>') + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    box.innerHTML = '<article class="doc">' + head + body +
      (hidden && rows.length ? '<p class="doc-foot">내용이 없는 부서 ' + hidden + '곳은 숨겼습니다.</p>' : '') + '</article>';
  }

  function renderResults(kind) {
    var view = $('#view-' + kind), st = S.meet[kind], box = $('.meet-results', view);
    if (st.searching) { box.innerHTML = '<section class="results"><div class="pad">지난 회의록 전체에서 찾는 중입니다. 처음 찾을 때는 10초쯤 걸릴 수 있습니다.</div></section>'; return; }
    if (!st.search) { box.innerHTML = ''; return; }
    var r = st.search;
    var head = '<div class="results-head"><span><b>‘' + esc(r.query) + '’</b> 검색 결과 ' + r.results.length + '건</span><span class="muted">회의록 ' + r.scanned + '개 확인</span>' +
      '<button class="btn ghost" type="button" data-act="clear-search">검색 닫기</button></div>';
    var list = r.results.length ? '<ol class="results-list">' + r.results.map(function (x) {
      return '<li><button type="button" data-goto-sheet="' + esc(x.sheet) + '"><span class="r-date">' + esc(x.date ? x.date.replace(/-/g, '.') : x.sheet) + '</span>' +
        '<span class="r-dept">' + esc(x.dept) + '</span><span class="r-snip">' + hl(x.snippet, r.query) + '</span></button></li>';
    }).join('') + '</ol>' : '<div class="pad">찾는 낱말이 들어간 회의록이 없습니다. 다른 낱말로 찾아보세요.</div>';
    box.innerHTML = '<section class="results" aria-live="polite">' + head + list + '</section>';
  }

  function searchMeeting(kind, q) {
    var st = S.meet[kind];
    q = q.trim();
    if (!q) { clearSearch(kind); return; }
    st.searching = true; st.search = null;
    renderResults(kind);
    call('searchMeetings', kind, q).then(function (res) {
      st.search = res; st.query = res.query;
    }).catch(function (e) {
      st.search = { query: q, results: [], scanned: 0 };
      alert('검색하지 못했습니다: ' + msg(e));
    }).then(function () {
      st.searching = false;
      renderResults(kind);
      renderMeetingDoc(kind);
    });
  }

  function clearSearch(kind) {
    var st = S.meet[kind];
    st.search = null; st.query = ''; st.searching = false;
    $('.meet-search input', $('#view-' + kind)).value = '';
    renderResults(kind);
    renderMeetingDoc(kind);
  }

  // ---------- 주간업무 ----------
  function renderWeekly() {
    var el = $('#view-weekly'), w = S.data.weekly, t = S.data.today;
    if (!w || w.error) { el.innerHTML = errorBox('주간업무를 읽지 못했습니다.', w && w.error); return; }
    if (!w.days.length) { el.innerHTML = '<div class="notice"><b>주간업무 입력 시트가 비어 있습니다.</b></div>'; return; }
    var hasNote = w.days.some(function (d) { return d.items.some(function (i) { return i.note; }); });
    var rows = '';
    w.days.forEach(function (day) {
      var items = day.items.length ? day.items : [null];
      var tn = dayTone(day.date), isToday = day.date === t;
      items.forEach(function (it, i) {
        rows += '<tr class="' + (i === 0 ? 'day-start ' : '') + (isToday ? 'is-today' : '') + '">' +
          (i === 0 ? '<th scope="rowgroup" rowspan="' + items.length + '"><button type="button" class="daybtn" data-day="' + day.date + '"><span class="d ' + (tn ? 'is-' + tn + '-t' : '') + '">' + md(day.date) + '</span><span class="w">' + DOW[dow(day.date)] + '요일' + (isToday ? ' <b>오늘</b>' : '') + '</span></button></th>' : '') +
          '<td class="w-text">' + (it ? esc(it.text) : '<span class="muted">없음</span>') + '</td>' +
          '<td class="w-dept">' + (it ? esc(it.dept) : '') + '</td>' +
          (hasNote ? '<td class="w-note">' + (it ? esc(it.note) : '') + '</td>' : '') + '</tr>';
      });
    });
    var notices = w.notices.length ? '<section class="notices"><h3>안내사항</h3><dl>' + w.notices.map(function (n) {
      return '<dt>' + esc(n.label) + '</dt><dd>' + esc(n.text) + (n.dept ? '<span class="chip">' + esc(n.dept) + '</span>' : '') + '</dd>';
    }).join('') + '</dl></section>' : '';
    el.innerHTML = '<article class="doc">' +
      '<header class="doc-head"><div><h2 class="doc-title">주간업무</h2><p class="doc-date">' + mdw(w.start) + ' ~ ' + mdw(w.end) + '</p></div>' +
      '<p class="doc-meta">주간업무 파일의 입력 시트 내용입니다.</p></header>' +
      '<table class="weekly"><thead><tr><th scope="col">날짜</th><th scope="col">추진사항</th><th scope="col">담당부서</th>' + (hasNote ? '<th scope="col">기타</th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table>' +
      notices + '</article>';
  }

  // ---------- 월간계획 ----------
  function monthIdx() {
    var ms = monthsArr();
    for (var i = 0; i < ms.length; i++) if (ms[i].year + '-' + p2(ms[i].month) === S.month.key) return i;
    return -1;
  }

  function renderMonthly() {
    var view = $('#view-monthly'), mo = S.data.monthly, ms = monthsArr();
    var note = $('#mnote');
    document.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === S.month.mode ? 'true' : 'false'); });
    if (!mo || mo.error || !ms.length) {
      $('.mbar', view).hidden = true;
      $('#mbody').innerHTML = mo && mo.error ? errorBox('월간계획을 읽지 못했습니다.', mo.error) : '<div class="notice"><b>‘10월’처럼 달 이름으로 된 시트를 찾지 못했습니다.</b></div>';
      return;
    }
    $('.mbar', view).hidden = false;
    var i = monthIdx(), cur = ms[i];
    $('#mtitle').textContent = cur.year + '년 ' + cur.month + '월';
    $('[data-act=mprev]', view).disabled = i <= 0;
    $('[data-act=mnext]', view).disabled = i >= ms.length - 1;
    var tk = S.data.today.slice(0, 7);
    $('[data-act=mtoday]', view).disabled = !S.monthKeys[tk] || S.month.key === tk;
    if (!S.monthKeys[tk]) {
      var tm = +tk.slice(5, 7);
      note.textContent = '이번 달(' + tm + '월) 월간계획 시트가 아직 없습니다. 월간계획 파일에 ‘' + tm + '월’ 시트를 만들면 여기에 자동으로 나타납니다.';
      note.hidden = false;
    } else {
      note.hidden = true;
    }
    renderMonthBody();
  }

  function renderMonthBody() {
    var body = $('#mbody'), ms = monthsArr();
    if (!ms.length) return;
    if (S.month.query) { body.innerHTML = monthSearchHtml(S.month.query); return; }
    var cur = ms[monthIdx()];
    body.innerHTML = S.month.mode === 'grid' ? calendarHtml(cur) : monthListHtml(cur);
  }

  function calendarHtml(m) {
    var t = S.data.today;
    var first = m.year + '-' + p2(m.month) + '-01';
    var lead = dow(first);
    var dim = new Date(Date.UTC(m.year, m.month, 0)).getUTCDate();
    var h = '<div class="cal" role="grid" aria-label="' + m.year + '년 ' + m.month + '월 달력">';
    DOW.forEach(function (w, i) { h += '<div class="wd ' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '" role="columnheader">' + w + '</div>'; });
    for (var b = 0; b < lead; b++) h += '<div class="cell blank" aria-hidden="true"></div>';
    for (var dnum = 1; dnum <= dim; dnum++) {
      var iso = m.year + '-' + p2(m.month) + '-' + p2(dnum);
      var day = m.days[iso];
      var evs = day ? day.events : [];
      var tn = dayTone(iso);
      var cls = 'cell' + (tn ? ' ' + tn : '') + (iso === t ? ' today' : '') + (evs.length ? ' has-ev' : '');
      var shown = evs.slice(0, 4).map(function (ev) {
        return '<span class="ev' + (isHol(ev) ? ' hol' : '') + '">' + esc(ev.text) + '</span>';
      }).join('');
      var more = evs.length > 4 ? '<span class="more">외 ' + (evs.length - 4) + '건</span>' : '';
      h += '<button type="button" class="' + cls + '" data-day="' + iso + '" aria-label="' + m.month + '월 ' + dnum + '일 ' + DOW[dow(iso)] + '요일, 일정 ' + evs.length + '건">' +
        '<span class="num">' + dnum + '</span>' + shown + more + '</button>';
    }
    var tail = (7 - ((lead + dim) % 7)) % 7;
    for (var c = 0; c < tail; c++) h += '<div class="cell blank" aria-hidden="true"></div>';
    return h + '</div>';
  }

  function dayRowHtml(iso, day, q) {
    var tn = dayTone(iso);
    var evs = day.events.map(function (ev) {
      return '<li>' + hl(ev.text, q) + (ev.owner ? '<span class="who">' + hl(ev.owner, q) + '</span>' : '') + '</li>';
    }).join('');
    return '<div class="row' + (iso === S.data.today ? ' today' : '') + '"><button type="button" class="datebtn ' + (tn ? 'is-' + tn + '-t' : '') + '" data-day="' + iso + '">' +
      md(iso) + '<small>' + DOW[dow(iso)] + '</small></button><div><ul class="items">' + evs + '</ul>' +
      (day.owners ? '<div class="who" style="margin:4px 0 0 13px">담당: ' + hl(day.owners, q) + '</div>' : '') + '</div></div>';
  }

  function monthListHtml(m) {
    var keys = Object.keys(m.days).sort().filter(function (k) { return m.days[k].events.length; });
    if (!keys.length) return '<div class="mlist"><div class="row-head">이 달에 등록된 일정이 없습니다.</div></div>';
    return '<div class="mlist">' + keys.map(function (k) { return dayRowHtml(k, m.days[k], ''); }).join('') + '</div>';
  }

  function monthSearchHtml(q) {
    var needle = q.toLowerCase(), rows = [], n = 0;
    monthsArr().forEach(function (m) {
      Object.keys(m.days).sort().forEach(function (k) {
        var day = m.days[k];
        var hit = day.events.filter(function (ev) { return (ev.text + ' ' + ev.owner).toLowerCase().indexOf(needle) >= 0; });
        var ownerHit = (day.owners || '').toLowerCase().indexOf(needle) >= 0;
        if (!hit.length && !ownerHit) return;
        n += hit.length || day.events.length;
        rows.push(dayRowHtml(k, { events: hit.length ? hit : day.events, owners: day.owners }, q));
      });
    });
    return '<div class="mlist"><div class="row-head"><span><b>‘' + esc(q) + '’</b> 찾은 날 ' + rows.length + '일</span><button class="btn ghost" type="button" data-act="mclear">검색 지우기</button></div>' +
      (rows.length ? rows.join('') : '<div class="row-head muted">모든 달의 월간계획에서 찾지 못했습니다.</div>') + '</div>';
  }

  function stepMonth(delta) {
    var ms = monthsArr(), i = monthIdx() + delta;
    if (i < 0 || i >= ms.length) return;
    S.month.key = ms[i].year + '-' + p2(ms[i].month);
    renderMonthly();
  }

  // ---------- 날짜 상세 ----------
  function openDay(iso) {
    if (!S.openDay) S.lastFocus = document.activeElement;
    S.openDay = iso;
    var day = S.dayIndex[iso], wk = weeklyMap()[iso], tn = dayTone(iso), dt = D(iso);
    var mo;
    if (day && day.events.length) {
      mo = '<ul class="items" style="--dot:var(--pine)">' + day.events.map(function (ev) {
        return '<li>' + esc(ev.text) + (ev.owner ? '<span class="dp-owner">담당 ' + esc(ev.owner) + '</span>' : '') + '</li>';
      }).join('') + '</ul>' + (day.owners ? '<p class="who" style="margin:6px 0 0 13px">담당: ' + esc(day.owners) + '</p>' : '');
    } else {
      mo = '<p class="muted" style="margin:0">' + (S.monthKeys[iso.slice(0, 7)] ? '등록된 일정이 없습니다.' : (dt.getUTCMonth() + 1) + '월 월간계획 시트가 아직 없습니다.') + '</p>';
    }
    var wkHtml = wk ? '<section class="dp-sec"><span class="tag tag-w">주간업무</span>' + (wk.items.length ? '<ul class="items" style="--dot:var(--ochre)">' + wk.items.map(function (it) {
      return '<li>' + esc(it.text) + (it.dept ? '<span class="dp-owner">' + esc(it.dept.replace(/\n/g, ', ')) + '</span>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="muted" style="margin:0">없음</p>') + '</section>' : '';
    var p = $('#dayPanel');
    p.innerHTML =
      '<div class="dp-head"><h2 id="dpTitle" class="' + (tn ? 'is-' + tn + '-t' : '') + '">' + (dt.getUTCMonth() + 1) + '월 ' + dt.getUTCDate() + '일 ' + DOW[dow(iso)] + '요일</h2>' +
      '<button class="btn" type="button" data-act="close-day">닫기</button></div>' +
      '<section class="dp-sec"><span class="tag tag-m">월간계획</span>' + mo + '</section>' + wkHtml +
      '<div class="dp-nav"><button class="btn" type="button" data-act="day-prev">‹ 전날</button><button class="btn" type="button" data-act="day-next">다음 날 ›</button></div>';
    p.hidden = false;
    $('#backdrop').hidden = false;
    $('[data-act=close-day]', p).focus();
  }

  function closeDay() {
    S.openDay = null;
    $('#dayPanel').hidden = true;
    $('#backdrop').hidden = true;
    if (S.lastFocus && document.body.contains(S.lastFocus)) S.lastFocus.focus();
  }

  // ---------- 이벤트 ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, [data-goto-sheet]');
    if (e.target.id === 'backdrop') { closeDay(); return; }
    if (!el) return;
    var view = el.closest('.view');
    var kind = view && view.getAttribute('data-kind');

    if (el.getAttribute('role') === 'tab') { showView(el.getAttribute('data-view'), false); return; }
    if (el.id === 'refreshBtn') { load(true); return; }
    if (el.hasAttribute('data-goto')) { showView(el.getAttribute('data-goto'), false); window.scrollTo(0, 0); return; }
    if (el.hasAttribute('data-day')) { openDay(el.getAttribute('data-day')); return; }
    if (el.hasAttribute('data-goto-sheet') && kind) {
      var idx = S.data[kind].sheets.indexOf(el.getAttribute('data-goto-sheet'));
      if (idx >= 0) { goMeeting(kind, idx); $('.meet-doc', view).scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      return;
    }
    if (el.hasAttribute('data-mode')) { S.month.mode = el.getAttribute('data-mode'); renderMonthly(); return; }

    switch (el.getAttribute('data-act')) {
      case 'older': if (kind) goMeeting(kind, S.meet[kind].idx + 1); break;
      case 'newer': if (kind) goMeeting(kind, S.meet[kind].idx - 1); break;
      case 'clear-search': if (kind) clearSearch(kind); break;
      case 'mprev': stepMonth(-1); break;
      case 'mnext': stepMonth(1); break;
      case 'mtoday': S.month.key = S.data.today.slice(0, 7); renderMonthly(); break;
      case 'mclear': S.month.query = ''; $('#mq').value = ''; renderMonthly(); break;
      case 'close-day': closeDay(); break;
      case 'day-prev': openDay(add(S.openDay, -1)); break;
      case 'day-next': openDay(add(S.openDay, 1)); break;
      case 'retry': $('#fatal').hidden = true; $('#loading').hidden = false; load(false); break;
    }
  });

  document.addEventListener('change', function (e) {
    var view = e.target.closest('.view');
    var kind = view && view.getAttribute('data-kind');
    if (!kind) return;
    if (e.target.classList.contains('sheet-select')) goMeeting(kind, +e.target.value);
    if (e.target.classList.contains('hide-empty')) { S.meet[kind].hideEmpty = e.target.checked; renderMeetingDoc(kind); }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var view = e.target.closest('.view');
    var kind = view && view.getAttribute('data-kind');
    if (kind && e.target.classList.contains('meet-search')) searchMeeting(kind, e.target.q.value);
  });

  var mqTimer = null;
  $('#mq').addEventListener('input', function (e) {
    clearTimeout(mqTimer);
    var v = e.target.value.trim();
    mqTimer = setTimeout(function () { S.month.query = v; renderMonthBody(); }, 160);
  });

  $('.tabs-inner').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
    var i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    e.stopPropagation();
    var n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    showView(n.getAttribute('data-view'), true);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.openDay) { closeDay(); return; }
    if (S.openDay || !S.data) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.target.getAttribute('role') === 'tab') return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var left = e.key === 'ArrowLeft';
    if (S.view === 'monthly' && !S.month.query) stepMonth(left ? -1 : 1);
    else if (S.view === 'bujang' || S.view === 'gyomu') goMeeting(S.view, S.meet[S.view].idx + (left ? 1 : -1));
  });

  load(false);
})();
</script>
</body>
</html>
